name: notebooks

# Run every notebook end-to-end on PRs that touch them, and verify that the
# README / onboarding don't reference notebook numbers that don't exist.
#
# The legacy flat 19-notebook layout under previous_versions/ is intentionally
# excluded — it's an archive copy of the pre-2026 course.
#
# Local equivalents:
#   python scripts/check_nb_references.py
#   python scripts/run_all_notebooks.py .

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.ipynb"
      - "**/*.py"
      - "**/*.md"
      - "requirements.txt"
      - ".github/workflows/notebooks.yml"

jobs:
  link-check:
    name: NB-reference link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Check NB-number references in markdown / notebooks resolve to real files
        run: python scripts/check_nb_references.py

  execute-notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    needs: link-check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert nbclient ipykernel
      - name: Run all notebooks (excluding previous_versions/)
        env:
          # llm_providers.py lives at the repo root so every notebook can `import` it
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_all_notebooks.py .
