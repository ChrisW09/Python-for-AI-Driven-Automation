name: links

# Checks that the many links in the README and docs (Colab badges, tools,
# references) still resolve. External hosts rate-limit, so this runs on PRs,
# on a weekly schedule, and on demand — not on every push to main — to keep
# the default branch's status independent of third-party flakiness.

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          # Retry transient failures; treat rate-limit (429) as OK so busy
          # hosts don't fail the build. Skips the .venv and archived trees.
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude-path .venv
            --exclude-path previous_versions
            './**/*.md'
          fail: true
