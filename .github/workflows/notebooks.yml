name: notebooks

# Two gates for the course:
#   1. check_nb_references.py — every "NB n" / "Notebook n" reference resolves.
#   2. run_all_notebooks.py   — every notebook executes end-to-end. Intentional
#      Debug-me cells are reported as xfail and do NOT fail the build; only a
#      genuine regression turns the job red.
#
# Only the base requirements.txt is installed. The optional appendix libraries
# (torch, prophet, faiss, …) are intentionally absent — each appendix is built to
# run offline via a built-in stand-in, so the suite stays green without them.
#
# Note: 03_real_world_io/12_apis_and_http.ipynb makes one live (keyless) weather
# API call; the hosted runner has network, but an upstream outage could flake it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg          # headless matplotlib backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ipykernel
          python -m ipykernel install --user --name python3

      - name: Check notebook cross-references
        run: python scripts/check_nb_references.py

      - name: Execute all notebooks (xfail-aware gate)
        run: python scripts/run_all_notebooks.py . --json execution-snapshot.json

      - name: Upload execution snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-snapshot
          path: execution-snapshot.json
