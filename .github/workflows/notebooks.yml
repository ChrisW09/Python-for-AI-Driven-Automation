name: notebooks

# Run every notebook end-to-end on PRs that touch them, and verify that
# the README / onboarding don't reference notebook numbers that don't exist.
#
# Local equivalents:
#   python scripts/check_nb_references.py
#   jupyter nbconvert --to notebook --execute --output /tmp/out.ipynb <nb>

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.ipynb"
      - "**/*.py"
      - "**/*.md"
      - "requirements.txt"
      - "refined_course/requirements.txt"
      - ".github/workflows/notebooks.yml"

jobs:
  link-check:
    name: NB-reference link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Check NB-number references in markdown / notebooks resolve to real files
        run: python scripts/check_nb_references.py

  execute-notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    needs: link-check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layout: [refined_course, top_level]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The refined-course requirements are a superset; use them for both layouts.
          pip install -r refined_course/requirements.txt
          pip install jupyter nbconvert nbclient ipykernel
      - name: Run all notebooks
        env:
          PYTHONPATH: ${{ github.workspace }}/refined_course:${{ github.workspace }}
        run: |
          if [ "${{ matrix.layout }}" = "refined_course" ]; then
            python scripts/run_all_notebooks.py refined_course
          else
            python scripts/run_all_notebooks.py . --exclude refined_course
          fi
