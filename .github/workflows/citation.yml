name: citation

# Keeps CITATION.cff valid so GitHub's "Cite this repository" button always
# works and reference managers can parse it. Fast and dependency-light —
# only runs when the citation file itself changes.

on:
  push:
    paths:
      - "CITATION.cff"
      - ".github/workflows/citation.yml"
  pull_request:
    paths:
      - "CITATION.cff"
      - ".github/workflows/citation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cffconvert
      - name: Validate CITATION.cff
        run: cffconvert --validate
